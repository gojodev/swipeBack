<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>popup</title>
    <link rel="stylesheet" type="text/css" href="popup_style.css" />
  </head>

  <body>
    <div class="container">
      <div class="status-indicator status-inactive hidden" id="status-inactive">
        <span class="status-icon">!</span>
        <span id="status-message">SwipeBack is not available on this page</span>
      </div>
      <button id="reload-button" class="hidden">Reload page</button>
      <div class="nav-buttons hidden" id="nav-buttons">
        <button id="back-button">&larr; Back</button>
        <button id="forward-button">Forward &rarr;</button>
      </div>

      <div class="center">
        <a href="https://gojodev.com" target="_blank">
          <img src="gojodev.webp" id="gojodev" class="box-shadow" />
        </a>
        <h4>Thanks for using SwipeBack!</h4>
        <br />
      </div>

      <label class="setting" for="animations-toggle">
        <span>Show swipe animation</span>
        <span class="switch">
          <input type="checkbox" id="animations-toggle" />
          <span class="slider"></span>
        </span>
      </label>
      <h4 style="text-align: center">Created By Emmanuel Koledoye</h4>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
