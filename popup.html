<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>popup</title>
    <link rel="stylesheet" type="text/css" href="popup_style.css" />
  </head>

  <body>
    <div class="container">
      <div class="status-indicator status-inactive hidden" id="status-inactive">
        <span class="status-icon">!</span>
        <span>SwipeBack is not available on this page</span>
      </div>

      <div class="center">
        <a href="https://gojodev.com" target="_blank">
          <img src="gojodev.webp" id="gojodev" class="box-shadow" />
        </a>
        <h4>Thanks for using SwipeBack!</h4>

        <br />
      </div>
      <h4 style="text-align: center">Created By Emmanuel Koledoye</h4>
    </div>

    <script>
      function checkContentScriptStatus() {
        chrome.tabs.query(
          { active: true, currentWindow: true },
          function (tabs) {
            if (tabs.length === 0) return;

            const tabId = tabs[0].id;
            chrome.tabs.sendMessage(
              tabId,
              { action: "checkStatus" },
              function (response) {
                const activeIndicator =
                  document.getElementById("status-active");
                const inactiveIndicator =
                  document.getElementById("status-inactive");

                if (chrome.runtime.lastError || !response) {
                  activeIndicator.classList.remove("hidden");
                  inactiveIndicator.classList.add("hidden");
                }
              }
            );
          }
        );
      }

      document.addEventListener("DOMContentLoaded", checkContentScriptStatus);
    </script>
  </body>
</html>
